# bowtie-3500 as a Design Spec — ticket 11's acceptance target.
#
# Generated by `scripts/spec_from_snapshot.py --workspace
# workspaces/bowtie-3500-pilot` and then completed by hand, exactly as ticket
# 07's checklist requires. What the reducer supplied exactly: all twelve
# variables with their AEDT expressions intact, the material reference, the one
# port and one boundary, the setup name. What it could not supply, and where
# the hand-completion came from:
#
#   - every geometry op came out `op: unknown` (a bounding box is a
#     consequence of a construction op, not a restatement of it), so the
#     geometry below is transcribed from the pilot's own construction record,
#     `workspaces/bowtie-3500-pilot/src/02_geometry.py`;
#   - the setup properties were `{}` — the snapshot_version 1 defect — so
#     frequency, passes and delta-S come from `src/06_setup_sweep.py`;
#   - the sweep range is not in a snapshot either, same source;
#   - `fr4_43` is user-defined, so it is an inline definition here, with the
#     values `src/03_materials.py` asserts.
#
# Provenance warning carried from `case.json`: Astuti et al. 2022 is NOT the
# source. Its dimensions are internally inconsistent and that inconsistency
# cost the pilot twenty hours. These numbers are the delivered model's.
spec_version: 1
name: bowtie-3500
recipe: bow-tie-patch
solution_type: Modal

provenance:
  source: "the delivered pilot model, workspaces/bowtie-3500-pilot (NOT Astuti et al. 2022)"
  canonical_reading: measured
  case: knowledge/cases/bowtie-3500
  notes: >-
    The paper this run started from is internally inconsistent — its equations
    do not reproduce its own Table I / Fig 1. The user arbitrated the Fig-1
    reading mid-run, and these are the arbitrated numbers as built. The model
    resonates at 3.85 GHz against a 3.5 GHz target; that is recorded honestly
    rather than corrected, because it is what the geometry actually does.

target:
  quantity: resonant_frequency
  value: 3.5GHz
  tolerance_pct: 8

variables:
  AirGap: 25mm
  CuT: 0.1mm
  FeedL: 45mm
  FeedW: 3.1118mm
  PatchBase: 20.2168mm
  PatchH: 24.3094mm
  PatchLeg: 26.3269mm
  PortH: 3*FeedW
  PortW: 3*FeedW
  SubH: 1.6mm
  SubL: 80mm
  SubW: 90mm

materials:
  # User-defined, not a library entry — the reducer flagged it and a snapshot
  # does not carry material properties, so these come from 03_materials.py.
  FR4_43:
    permittivity: 4.3
    loss_tangent: 0.02
  pec:
    library: pec
  air:
    library: air

geometry:
  - op: box
    name: Substrate
    material: FR4_43
    origin: ["-SubW/2", "-SubL/2", "0mm"]
    size: [SubW, SubL, SubH]

  - op: box
    name: Ground
    material: pec
    origin: ["-SubW/2", "-SubL/2", "-CuT"]
    size: [SubW, SubL, CuT]

  # Two triangular petals meeting at the waist (0,0). CCW winding gives a +Z
  # normal so thicken_sheet extrudes upward; the tip overlaps the stub
  # footprint, which is what lets the three pieces unite into one conductor.
  - op: polyline
    name: PatchBowtie
    material: pec
    cover: true
    close: true
    points:
      - ["-PatchBase/2", "-PatchH", SubH]
      - ["PatchBase/2", "-PatchH", SubH]
      - ["0mm", "0mm", SubH]

  - op: polyline
    name: PatchTriUp
    material: pec
    cover: true
    close: true
    points:
      - ["-PatchBase/2", PatchH, SubH]
      - ["0mm", "0mm", SubH]
      - ["PatchBase/2", PatchH, SubH]

  - op: box
    name: FeedLine
    material: pec
    origin: ["0mm", "-FeedW/2", SubH]
    size: [FeedL, FeedW, CuT]

  - op: thicken_sheet
    name: PatchBowtie
    thickness: CuT
  - op: thicken_sheet
    name: PatchTriUp
    thickness: CuT

  # The united solid keeps the first operand's name.
  - op: unite
    name: PatchBowtie
    with: [PatchTriUp, FeedLine]

  # The port sheet, on the +X substrate edge the feed stub reaches.
  - op: sheet
    name: PortSheet
    plane: yz
    origin: ["SubW/2", "-PortW/2", "-CuT"]
    size: [PortW, PortH]

  # +X face flush with the port plane at x = +SubW/2 (feed-location discipline).
  - op: box
    name: AirBox
    material: air
    origin: ["-SubW/2 - AirGap", "-SubL/2 - AirGap", "-CuT - AirGap"]
    size: ["SubW + AirGap", "SubL + 2*AirGap", "SubH + CuT + 2*AirGap"]

excitations:
  - name: "1"
    type: wave_port
    on:
      object: PortSheet
    impedance: 50ohm

boundaries:
  # AEDT appends a random suffix (`Rad__M4WFEW` in the pilot's snapshot);
  # ticket 11's diff normalises it with the pilot's own canon().
  - name: Rad
    type: radiation
    on:
      outer_faces: AirBox

mesh:
  - type: adaptive_only

setup:
  name: Setup1
  solution_frequency: 3.5GHz
  max_passes: 15
  delta_s: 0.02
  sweep:
    name: Sweep1
    type: discrete
    start: 3.2GHz
    stop: 4.2GHz
    count: 201

qa_signals: [convergence, ports_excited, in_band_resonance]
