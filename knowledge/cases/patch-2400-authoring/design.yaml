# patch-2400-authoring — the spec an author copies.
#
# The split. `patch-2400/design.yaml` is a *solved record*: it describes the
# model the 2026-08-15 run actually built and solved on this box, so its numbers
# cannot be corrected without breaking that correspondence
# (`docs/agents/fixture-fidelity.md`). It also carries an airbox pad of 31 mm —
# lambda0/4 at 2.4 GHz — written before the lambda0/3 rule existed. Four of five
# patch-family specs in the 2026-08-31 campaign independently chose lambda0/4 or
# worse, because the skill named that file as the thing to start from and there
# was no compliant worked example anywhere in the corpus to copy instead.
#
# So the roles are split rather than the record edited. This file is the same
# patch — every Balanis dimension identical to the solved record — and it is
# what `SKILL.md` and `reference/design-spec.md` now point authors at. Two
# things differ, both because an exemplar that trips the validator is the
# defect it is supposed to cure:
#
#   1. `air_pad` is the expression `c0 / (3 * f0)`, not a millimetre literal.
#      That is lambda0/3 exactly, and it **stays** lambda0/3 if f0 moves — a
#      literal silently would not. `c0` is a constant both `hfss_spec` and AEDT
#      provide, so the expression passes through verbatim and the parametric
#      link survives into the variable table.
#   2. The sweep brackets 2.4 GHz by 0.6 GHz on each side instead of 0.4 on the
#      near side, so the bracket warning does not fire either.
#
# This case is deliberately **not** in `index.json`: it is not a sixth structure
# the tool must build, it is the authoring exemplar for the first one. See
# `notes.md`.
spec_version: 1
name: patch-2400-authoring
recipe: inset-fed-rectangular-patch
solution_type: Modal            # explicit, never the default (env-compat #11)

provenance:
  source: "Balanis, Antenna Theory ch.14 design procedure (14-1, 14-2, 14-6, 14-7)"
  canonical_reading: closed-form
  case: knowledge/cases/patch-2400
  notes: >-
    Geometry numbers are patch-2400's, closed-form from that case's `case.json`;
    this file adds no dimension of its own. It is an authoring exemplar, not a
    record of a solve — nothing here has been built on a desktop, and the airbox
    is deliberately larger than the solved model's.

target:
  quantity: resonant_frequency
  value: 2.4GHz
  tolerance_pct: 5

variables:
  f0: 2.4GHz
  er: 4.4
  h: 1.6mm
  cu_t: 0.035mm
  patch_W: 38.0100mm            # Balanis 14-6
  patch_L: 29.4216mm            # Balanis 14-7 with 14-2 fringing
  feed_W: 3.06mm                # Hammerstad 50 ohm on this stack
  inset_d: 7.4mm                # the match tuner (~L/4); resonance is set by patch_L
  inset_g: 3.0mm
  sub_W: 80mm
  sub_L: 80mm
  # The radiation clearance, as an expression rather than a number: lambda0/3
  # at f0 (41.64 mm here). Write it this way and it tracks f0.
  air_pad: "c0 / (3 * f0)"
  feed_run: "sub_L/2 - patch_L/2"

materials:
  fr4:
    library: FR4_epoxy
  metal:
    library: pec
  air:
    library: air

geometry:
  - op: box
    name: Substrate
    material: fr4
    origin: ["-sub_W/2", "-sub_L/2", "0mm"]
    size: [sub_W, sub_L, h]

  - op: sheet
    name: GroundPlane
    material: metal
    plane: xy
    origin: ["-sub_W/2", "-sub_L/2", "0mm"]
    size: [sub_W, sub_L]

  - op: sheet
    name: Patch
    material: metal
    plane: xy
    origin: ["-patch_W/2", "-patch_L/2", h]
    size: [patch_W, patch_L]

  # The two inset notches that set the feed match. Cut, not drawn: the patch is
  # a rectangle minus two slots.
  - op: sheet
    name: InsetL
    plane: xy
    origin: ["-feed_W/2 - inset_g", "-patch_L/2", h]
    size: [inset_g, inset_d]
  - op: sheet
    name: InsetR
    plane: xy
    origin: ["feed_W/2", "-patch_L/2", h]
    size: [inset_g, inset_d]
  - op: subtract
    name: Patch
    tools: [InsetL, InsetR]
    keep_tools: false

  # 50 ohm microstrip feed from the substrate edge into the inset, united with
  # the patch so the port sees one conductor.
  - op: sheet
    name: Feed
    material: metal
    plane: xy
    origin: ["-feed_W/2", "-sub_L/2", h]
    size: [feed_W, "feed_run + inset_d"]
  - op: unite
    name: Patch
    with: [Feed]

  # The airbox. There is no clearance field in the schema — the clearance is
  # whatever these six expressions leave between this box and the model inside
  # it, which is why it has to be written deliberately. Pad every face by
  # `air_pad`: subtract it from each origin component, add twice it to each
  # size. `-air_pad` in z is the -z face; `h + 2*air_pad` puts the +z face
  # `air_pad` above the patch.
  - op: box
    name: AirBox
    material: air
    origin: ["-sub_W/2 - air_pad", "-sub_L/2 - air_pad", "-air_pad"]
    size: ["sub_W + 2*air_pad", "sub_L + 2*air_pad", "h + 2*air_pad"]

excitations:
  - name: P1
    type: lumped_port
    # The -y face of the substrate, where the feed line reaches the edge.
    # Symbolic: env-compat #7/#8 says assign by face object, never by id, and
    # pyAEDT 1.3.0 rejects a FacePrimitive here (patch-2400 run) — the compiler
    # resolves this to a sheet name plus the integration line below.
    on:
      face_of: Substrate
      direction: "-y"
      pick: largest_area
    integration_line:
      from:
        edge_mid: [GroundPlane, "-y", "max_z"]
      to:
        edge_mid: [Patch, "-y", "min_z"]
    impedance: 50ohm

boundaries:
  - name: Rad1
    type: radiation
    on:
      outer_faces: AirBox

mesh:
  - type: adaptive_only

setup:
  name: Setup1
  solution_frequency: f0
  max_passes: 15
  delta_s: 0.02
  sweep:
    name: Sweep1
    type: discrete
    start: 1.8GHz
    stop: 3.0GHz
    count: 241

qa_signals: [convergence, ports_excited, in_band_resonance, energy_pass]
