# logper-0800-6000 - printed log-periodic bow-tie dipole array, 0.8-6 GHz.
# Phase A: coax-fed, no enclosure. HFSS replica of the CST model
# "2_WITH_FEED_COAX_FR4_V1" in the ByTechLab repo
# (Repos/LogPer_Antenna/RF---PCB-Log-Periodic-Antenna--0.8-6-GHz-).
#
# GENERATED by tools/make_spec.py - the 30 bow-tie polylines follow one rule.
#
# Sources, cross-checked against each other in the Clarification block:
#   - CST parameter list (Touchstone header of
#     SIM_LOG_PERIODIC_COAX_FEED_WITHOUT_CASE.s1p)
#   - CST's own CAD export (CST_SIM/2_.../RESULTS/CAD/LOG_PERIOD.stp):
#     coax radii, coax axis height, wire bend, board outline
#   - KiCad copper polygons (LOG_PERIODIC_PCB.kicad_pcb, F.Cu / B.Cu)
#
# Frame: +x base -> tip, y transverse, z normal; substrate 0..h; coax on the
# z = h copper, far copper at z = 0.
#
# Element rule (n = 0..14): scale s_n = tau^n, centre xc_n = xc_(n-1) +
# bt_sp1*s_(n-1), root width bt_Wr1*s_n on the centreline, end width
# bt_We1*s_n at distance bt_L1*s_n. On the coax-side copper even n points +y;
# the far copper is the mirror image. Powers are written as chained products
# because the offline validator parses Python syntax and AEDT wants `^`.
#
# NOT expressible in schema v1, applied by post-compile staged scripts
# (recorded in state.md as Route-B add-ons):
#   src/20_feed_bend.py     - the centre conductor's 1.5 mm-radius bend
#   src/21_fr4_dispersion.py- FR-4 eps'(f), tand(f) from CST's fit tables
#   src/22_setup_extras.py  - broadband adaptive, field sweep, far-field sphere
spec_version: 1
name: logper-0800-6000
recipe: printed-log-periodic-bowtie-array
solution_type: Modal            # explicit, never the default (env-compat #11)

provenance:
  source: "ByTechLab PCB Log Periodic Antenna (0.8-6 GHz), CST model 2_WITH_FEED_COAX_FR4_V1; design basis Abdulhameed & Kubik, Electronics 2022, 11, 2877"
  canonical_reading: measured
  notes: >-
    As-built dimensions of the CST model are canonical, not the paper's
    equations: CST parameter list, CST STEP export and KiCad copper agree
    (feed 4 x 203.5 mm, element 0 = 60 mm / 30 mm / 5 mm, tau 0.85, coax
    0.255/0.76/1.045 mm, axis 1.03 mm above the copper, bend radius 1.5 mm).
    Substrate 1.5 mm as simulated in CST (KiCad stackup says 1.51 mm).
    Copper is zero-thickness finite-conductivity sheets here (CST: 35 um
    solids).

variables:
  f_lo: 0.8GHz
  f_hi: 6GHz
  h: 1.5mm                        # dielectric_thickness
  pcb_L: 205mm                    # pcb_length
  pcb_Wbase: 160mm                # pcb_width_base
  pcb_Wtip: 20mm                  # pcb_width_top
  feed_W: 4mm                     # feed_line_width
  feed_cut: 1.5mm                 # feed_cut_len: coax-side line stops short of the tip
  tau: 0.85                       # bowtie_linear_scaling_factor
  bt_L1: 60mm                     # first_bowtie_length, from the centreline
  bt_We1: 30mm                    # first_bowtie_width_end
  bt_Wr1: 5mm                     # first_bowtie_width, on the centreline
  bt_x1: 18mm                     # first_bowtie_start_offset
  bt_sp1: 30mm                    # first_bowtie_pos_offset
  r_in: 0.255mm                   # coax centre conductor radius
  r_d: 0.76mm                     # coax dielectric radius
  r_sh: 1.045mm                   # coax shield outer radius
  coax_zoff: 1.03mm               # coax axis above the copper plane (shield sinks 0.015 mm)
  bend_R: 1.5mm                   # cnd_off3: centre-conductor bend radius
  wire_tail: 0.25mm               # cnd_off1: wire protrudes below the far copper
  cap_L: 1mm                      # PEC cap backing the internal wave port
  coax_L: "pcb_L - feed_cut"
  zc: "h + coax_zoff"
  air_pad: "c0 / (4 * f_lo)"      # lambda/4 at the LOWEST frequency (93.7 mm)
  s0: 1
  s1: "s0 * tau"
  s2: "s1 * tau"
  s3: "s2 * tau"
  s4: "s3 * tau"
  s5: "s4 * tau"
  s6: "s5 * tau"
  s7: "s6 * tau"
  s8: "s7 * tau"
  s9: "s8 * tau"
  s10: "s9 * tau"
  s11: "s10 * tau"
  s12: "s11 * tau"
  s13: "s12 * tau"
  s14: "s13 * tau"
  xc0: bt_x1
  xc1: "xc0 + bt_sp1 * s0"
  xc2: "xc1 + bt_sp1 * s1"
  xc3: "xc2 + bt_sp1 * s2"
  xc4: "xc3 + bt_sp1 * s3"
  xc5: "xc4 + bt_sp1 * s4"
  xc6: "xc5 + bt_sp1 * s5"
  xc7: "xc6 + bt_sp1 * s6"
  xc8: "xc7 + bt_sp1 * s7"
  xc9: "xc8 + bt_sp1 * s8"
  xc10: "xc9 + bt_sp1 * s9"
  xc11: "xc10 + bt_sp1 * s10"
  xc12: "xc11 + bt_sp1 * s11"
  xc13: "xc12 + bt_sp1 * s12"
  xc14: "xc13 + bt_sp1 * s13"

materials:
  # Placeholder constants (band-centre of CST's fit). src/21_fr4_dispersion.py
  # replaces them with eps'(f), tand(f) datasets taken from CST's exported
  # "FR-4 (lossy)" fit: 4.81 @ 0.8 GHz -> 4.65 @ 6 GHz, tand 0.023-0.025.
  fr4_cst:
    permittivity: 4.72
    loss_tangent: 0.024
  # CST "PTFE (lossy)" as fitted in the model: 1.70, which with these radii
  # gives a 50.3 ohm line. Not the textbook 2.1.
  ptfe_coax:
    permittivity: 1.70
    loss_tangent: 0.0002
  # CST "Copper (pure)". Used on the 3D coax conductors only; the board
  # copper is a finite-conductivity boundary on sheets (env-compat #17).
  cu_pure:
    permittivity: 1.0
    conductivity: 59600000
  cap_pec:
    library: pec
  air:
    library: air

geometry:
  # Trapezoidal board, as CST's PCB solid (no mounting holes in the CST model).
  - op: polyline
    name: Substrate
    material: fr4_cst
    cover: true
    close: true
    points:
      - ["0mm", "-pcb_Wbase/2", "0mm"]
      - [pcb_L, "-pcb_Wtip/2", "0mm"]
      - [pcb_L, "pcb_Wtip/2", "0mm"]
      - ["0mm", "pcb_Wbase/2", "0mm"]
  - op: thicken_sheet
    name: Substrate
    thickness: h

  # Coax-side copper (KiCad F.Cu): feed line stops feed_cut short of the tip.
  # No material: sheets become metal by the boundaries below.
  - op: sheet
    name: TopCu
    plane: xy
    origin: ["0mm", "-feed_W/2", h]
    size: [coax_L, feed_W]
  - op: polyline
    name: TopBT00
    cover: true
    close: true
    points:
      - ["xc0 - bt_Wr1*s0/2", "0mm", h]
      - ["xc0 + bt_Wr1*s0/2", "0mm", h]
      - ["xc0 + bt_We1*s0/2", "bt_L1*s0", h]
      - ["xc0 - bt_We1*s0/2", "bt_L1*s0", h]
  - op: polyline
    name: TopBT01
    cover: true
    close: true
    points:
      - ["xc1 - bt_Wr1*s1/2", "0mm", h]
      - ["xc1 - bt_We1*s1/2", "-bt_L1*s1", h]
      - ["xc1 + bt_We1*s1/2", "-bt_L1*s1", h]
      - ["xc1 + bt_Wr1*s1/2", "0mm", h]
  - op: polyline
    name: TopBT02
    cover: true
    close: true
    points:
      - ["xc2 - bt_Wr1*s2/2", "0mm", h]
      - ["xc2 + bt_Wr1*s2/2", "0mm", h]
      - ["xc2 + bt_We1*s2/2", "bt_L1*s2", h]
      - ["xc2 - bt_We1*s2/2", "bt_L1*s2", h]
  - op: polyline
    name: TopBT03
    cover: true
    close: true
    points:
      - ["xc3 - bt_Wr1*s3/2", "0mm", h]
      - ["xc3 - bt_We1*s3/2", "-bt_L1*s3", h]
      - ["xc3 + bt_We1*s3/2", "-bt_L1*s3", h]
      - ["xc3 + bt_Wr1*s3/2", "0mm", h]
  - op: polyline
    name: TopBT04
    cover: true
    close: true
    points:
      - ["xc4 - bt_Wr1*s4/2", "0mm", h]
      - ["xc4 + bt_Wr1*s4/2", "0mm", h]
      - ["xc4 + bt_We1*s4/2", "bt_L1*s4", h]
      - ["xc4 - bt_We1*s4/2", "bt_L1*s4", h]
  - op: polyline
    name: TopBT05
    cover: true
    close: true
    points:
      - ["xc5 - bt_Wr1*s5/2", "0mm", h]
      - ["xc5 - bt_We1*s5/2", "-bt_L1*s5", h]
      - ["xc5 + bt_We1*s5/2", "-bt_L1*s5", h]
      - ["xc5 + bt_Wr1*s5/2", "0mm", h]
  - op: polyline
    name: TopBT06
    cover: true
    close: true
    points:
      - ["xc6 - bt_Wr1*s6/2", "0mm", h]
      - ["xc6 + bt_Wr1*s6/2", "0mm", h]
      - ["xc6 + bt_We1*s6/2", "bt_L1*s6", h]
      - ["xc6 - bt_We1*s6/2", "bt_L1*s6", h]
  - op: polyline
    name: TopBT07
    cover: true
    close: true
    points:
      - ["xc7 - bt_Wr1*s7/2", "0mm", h]
      - ["xc7 - bt_We1*s7/2", "-bt_L1*s7", h]
      - ["xc7 + bt_We1*s7/2", "-bt_L1*s7", h]
      - ["xc7 + bt_Wr1*s7/2", "0mm", h]
  - op: polyline
    name: TopBT08
    cover: true
    close: true
    points:
      - ["xc8 - bt_Wr1*s8/2", "0mm", h]
      - ["xc8 + bt_Wr1*s8/2", "0mm", h]
      - ["xc8 + bt_We1*s8/2", "bt_L1*s8", h]
      - ["xc8 - bt_We1*s8/2", "bt_L1*s8", h]
  - op: polyline
    name: TopBT09
    cover: true
    close: true
    points:
      - ["xc9 - bt_Wr1*s9/2", "0mm", h]
      - ["xc9 - bt_We1*s9/2", "-bt_L1*s9", h]
      - ["xc9 + bt_We1*s9/2", "-bt_L1*s9", h]
      - ["xc9 + bt_Wr1*s9/2", "0mm", h]
  - op: polyline
    name: TopBT10
    cover: true
    close: true
    points:
      - ["xc10 - bt_Wr1*s10/2", "0mm", h]
      - ["xc10 + bt_Wr1*s10/2", "0mm", h]
      - ["xc10 + bt_We1*s10/2", "bt_L1*s10", h]
      - ["xc10 - bt_We1*s10/2", "bt_L1*s10", h]
  - op: polyline
    name: TopBT11
    cover: true
    close: true
    points:
      - ["xc11 - bt_Wr1*s11/2", "0mm", h]
      - ["xc11 - bt_We1*s11/2", "-bt_L1*s11", h]
      - ["xc11 + bt_We1*s11/2", "-bt_L1*s11", h]
      - ["xc11 + bt_Wr1*s11/2", "0mm", h]
  - op: polyline
    name: TopBT12
    cover: true
    close: true
    points:
      - ["xc12 - bt_Wr1*s12/2", "0mm", h]
      - ["xc12 + bt_Wr1*s12/2", "0mm", h]
      - ["xc12 + bt_We1*s12/2", "bt_L1*s12", h]
      - ["xc12 - bt_We1*s12/2", "bt_L1*s12", h]
  - op: polyline
    name: TopBT13
    cover: true
    close: true
    points:
      - ["xc13 - bt_Wr1*s13/2", "0mm", h]
      - ["xc13 - bt_We1*s13/2", "-bt_L1*s13", h]
      - ["xc13 + bt_We1*s13/2", "-bt_L1*s13", h]
      - ["xc13 + bt_Wr1*s13/2", "0mm", h]
  - op: polyline
    name: TopBT14
    cover: true
    close: true
    points:
      - ["xc14 - bt_Wr1*s14/2", "0mm", h]
      - ["xc14 + bt_Wr1*s14/2", "0mm", h]
      - ["xc14 + bt_We1*s14/2", "bt_L1*s14", h]
      - ["xc14 - bt_We1*s14/2", "bt_L1*s14", h]
  - op: unite
    name: TopCu
    with: [TopBT00, TopBT01, TopBT02, TopBT03, TopBT04, TopBT05, TopBT06, TopBT07, TopBT08, TopBT09, TopBT10, TopBT11, TopBT12, TopBT13, TopBT14]

  # Far-side copper (KiCad B.Cu): mirror image, feed line runs to the tip.
  - op: sheet
    name: BotCu
    plane: xy
    origin: ["0mm", "-feed_W/2", "0mm"]
    size: [pcb_L, feed_W]
  - op: polyline
    name: BotBT00
    cover: true
    close: true
    points:
      - ["xc0 - bt_Wr1*s0/2", "0mm", "0mm"]
      - ["xc0 - bt_We1*s0/2", "-bt_L1*s0", "0mm"]
      - ["xc0 + bt_We1*s0/2", "-bt_L1*s0", "0mm"]
      - ["xc0 + bt_Wr1*s0/2", "0mm", "0mm"]
  - op: polyline
    name: BotBT01
    cover: true
    close: true
    points:
      - ["xc1 - bt_Wr1*s1/2", "0mm", "0mm"]
      - ["xc1 + bt_Wr1*s1/2", "0mm", "0mm"]
      - ["xc1 + bt_We1*s1/2", "bt_L1*s1", "0mm"]
      - ["xc1 - bt_We1*s1/2", "bt_L1*s1", "0mm"]
  - op: polyline
    name: BotBT02
    cover: true
    close: true
    points:
      - ["xc2 - bt_Wr1*s2/2", "0mm", "0mm"]
      - ["xc2 - bt_We1*s2/2", "-bt_L1*s2", "0mm"]
      - ["xc2 + bt_We1*s2/2", "-bt_L1*s2", "0mm"]
      - ["xc2 + bt_Wr1*s2/2", "0mm", "0mm"]
  - op: polyline
    name: BotBT03
    cover: true
    close: true
    points:
      - ["xc3 - bt_Wr1*s3/2", "0mm", "0mm"]
      - ["xc3 + bt_Wr1*s3/2", "0mm", "0mm"]
      - ["xc3 + bt_We1*s3/2", "bt_L1*s3", "0mm"]
      - ["xc3 - bt_We1*s3/2", "bt_L1*s3", "0mm"]
  - op: polyline
    name: BotBT04
    cover: true
    close: true
    points:
      - ["xc4 - bt_Wr1*s4/2", "0mm", "0mm"]
      - ["xc4 - bt_We1*s4/2", "-bt_L1*s4", "0mm"]
      - ["xc4 + bt_We1*s4/2", "-bt_L1*s4", "0mm"]
      - ["xc4 + bt_Wr1*s4/2", "0mm", "0mm"]
  - op: polyline
    name: BotBT05
    cover: true
    close: true
    points:
      - ["xc5 - bt_Wr1*s5/2", "0mm", "0mm"]
      - ["xc5 + bt_Wr1*s5/2", "0mm", "0mm"]
      - ["xc5 + bt_We1*s5/2", "bt_L1*s5", "0mm"]
      - ["xc5 - bt_We1*s5/2", "bt_L1*s5", "0mm"]
  - op: polyline
    name: BotBT06
    cover: true
    close: true
    points:
      - ["xc6 - bt_Wr1*s6/2", "0mm", "0mm"]
      - ["xc6 - bt_We1*s6/2", "-bt_L1*s6", "0mm"]
      - ["xc6 + bt_We1*s6/2", "-bt_L1*s6", "0mm"]
      - ["xc6 + bt_Wr1*s6/2", "0mm", "0mm"]
  - op: polyline
    name: BotBT07
    cover: true
    close: true
    points:
      - ["xc7 - bt_Wr1*s7/2", "0mm", "0mm"]
      - ["xc7 + bt_Wr1*s7/2", "0mm", "0mm"]
      - ["xc7 + bt_We1*s7/2", "bt_L1*s7", "0mm"]
      - ["xc7 - bt_We1*s7/2", "bt_L1*s7", "0mm"]
  - op: polyline
    name: BotBT08
    cover: true
    close: true
    points:
      - ["xc8 - bt_Wr1*s8/2", "0mm", "0mm"]
      - ["xc8 - bt_We1*s8/2", "-bt_L1*s8", "0mm"]
      - ["xc8 + bt_We1*s8/2", "-bt_L1*s8", "0mm"]
      - ["xc8 + bt_Wr1*s8/2", "0mm", "0mm"]
  - op: polyline
    name: BotBT09
    cover: true
    close: true
    points:
      - ["xc9 - bt_Wr1*s9/2", "0mm", "0mm"]
      - ["xc9 + bt_Wr1*s9/2", "0mm", "0mm"]
      - ["xc9 + bt_We1*s9/2", "bt_L1*s9", "0mm"]
      - ["xc9 - bt_We1*s9/2", "bt_L1*s9", "0mm"]
  - op: polyline
    name: BotBT10
    cover: true
    close: true
    points:
      - ["xc10 - bt_Wr1*s10/2", "0mm", "0mm"]
      - ["xc10 - bt_We1*s10/2", "-bt_L1*s10", "0mm"]
      - ["xc10 + bt_We1*s10/2", "-bt_L1*s10", "0mm"]
      - ["xc10 + bt_Wr1*s10/2", "0mm", "0mm"]
  - op: polyline
    name: BotBT11
    cover: true
    close: true
    points:
      - ["xc11 - bt_Wr1*s11/2", "0mm", "0mm"]
      - ["xc11 + bt_Wr1*s11/2", "0mm", "0mm"]
      - ["xc11 + bt_We1*s11/2", "bt_L1*s11", "0mm"]
      - ["xc11 - bt_We1*s11/2", "bt_L1*s11", "0mm"]
  - op: polyline
    name: BotBT12
    cover: true
    close: true
    points:
      - ["xc12 - bt_Wr1*s12/2", "0mm", "0mm"]
      - ["xc12 - bt_We1*s12/2", "-bt_L1*s12", "0mm"]
      - ["xc12 + bt_We1*s12/2", "-bt_L1*s12", "0mm"]
      - ["xc12 + bt_Wr1*s12/2", "0mm", "0mm"]
  - op: polyline
    name: BotBT13
    cover: true
    close: true
    points:
      - ["xc13 - bt_Wr1*s13/2", "0mm", "0mm"]
      - ["xc13 + bt_Wr1*s13/2", "0mm", "0mm"]
      - ["xc13 + bt_We1*s13/2", "bt_L1*s13", "0mm"]
      - ["xc13 - bt_We1*s13/2", "bt_L1*s13", "0mm"]
  - op: polyline
    name: BotBT14
    cover: true
    close: true
    points:
      - ["xc14 - bt_Wr1*s14/2", "0mm", "0mm"]
      - ["xc14 - bt_We1*s14/2", "-bt_L1*s14", "0mm"]
      - ["xc14 + bt_We1*s14/2", "-bt_L1*s14", "0mm"]
      - ["xc14 + bt_Wr1*s14/2", "0mm", "0mm"]
  - op: unite
    name: BotCu
    with: [BotBT00, BotBT01, BotBT02, BotBT03, BotBT04, BotBT05, BotBT06, BotBT07, BotBT08, BotBT09, BotBT10, BotBT11, BotBT12, BotBT13, BotBT14]

  # --- coax, lying on the coax-side feed line, base (x=0) to coax_L ---------
  - op: cylinder
    name: InnerCond
    material: cu_pure
    axis: x
    origin: ["0mm", "0mm", zc]
    radius: r_in
    height: coax_L
  - op: cylinder
    name: CoaxDiel
    material: ptfe_coax
    axis: x
    origin: ["0mm", "0mm", zc]
    radius: r_d
    height: coax_L
  - op: subtract
    name: CoaxDiel
    tools: [InnerCond]
    keep_tools: true
  - op: cylinder
    name: Shield
    material: cu_pure
    axis: x
    origin: ["0mm", "0mm", zc]
    radius: r_sh
    height: coax_L
  - op: cylinder
    name: ShieldBore
    axis: x
    origin: ["0mm", "0mm", zc]
    radius: r_d
    height: coax_L
  # CST sinks the shield 0.015 mm into its 35 um trace. With sheet copper the
  # same overlap would cut into the substrate, so the shield is trimmed flat at
  # z = h: it rests on the trace through a 0.35 mm wide facet, as in CST.
  - op: box
    name: ShieldTrim
    origin: ["-1mm", "-r_sh", "h - 1mm"]
    size: ["coax_L + 2mm", "2*r_sh", "1mm"]
  - op: subtract
    name: Shield
    tools: [ShieldBore, ShieldTrim]
    keep_tools: false

  # Centre conductor's vertical leg on the board tip edge (x = pcb_L): from
  # wire_tail below the far copper up to the start of the bend. The bend that
  # joins it to InnerCond is src/20_feed_bend.py (no circle primitive / swept
  # arc in schema v1).
  - op: cylinder
    name: WireLeg
    material: cu_pure
    axis: z
    origin: [pcb_L, "0mm", "-wire_tail"]
    radius: r_in
    height: "wire_tail + zc - bend_R"
  # The wire is half-buried in the board edge and passes through the far
  # copper: notch both, as CST's PCB and copper solids are notched.
  - op: subtract
    name: Substrate
    tools: [WireLeg]
    keep_tools: true
  - op: subtract
    name: BotCu
    tools: [WireLeg]
    keep_tools: true

  # PEC cap behind the coax end: backs the internal wave port (a wave port
  # must sit on an outer boundary or a conductor - Global/Ports notes).
  - op: cylinder
    name: PortCap
    material: cap_pec
    axis: x
    origin: ["-cap_L", "0mm", zc]
    radius: r_sh
    height: cap_L

  # Radiation box: lambda/4 at f_lo on every side.
  - op: box
    name: AirBox
    material: air
    origin: ["-air_pad - cap_L", "-pcb_Wbase/2 - air_pad", "-air_pad"]
    size: ["pcb_L + cap_L + 2*air_pad", "pcb_Wbase + 2*air_pad", "h + 2*r_sh + 2*air_pad"]

excitations:
  # Coax TEM mode on the dielectric's annular end face at x = 0 (CST: 50 ohm
  # discrete port at the same coax end). Line Z0 = 50.3 ohm, renormalised to 50.
  - name: P1
    type: wave_port
    on:
      face_of: CoaxDiel
      direction: "-x"
    impedance: 50ohm
    renormalize: true

boundaries:
  - name: TopCuMetal
    type: finite_conductivity
    on:
      object: TopCu
    conductivity: 59600000
  - name: BotCuMetal
    type: finite_conductivity
    on:
      object: BotCu
    conductivity: 59600000
  - name: Rad1
    type: radiation
    on:
      outer_faces: AirBox

mesh:
  - type: adaptive_only

# Baseline setup; src/22_setup_extras.py switches the adaptive solve to
# broadband (f_lo..f_hi) and adds the field sweep + far-field sphere.
setup:
  name: Setup1
  solution_frequency: f_hi
  max_passes: 12
  delta_s: 0.02
  sweep:
    name: Sweep1
    type: interpolating
    start: 0.4GHz
    stop: 6.5GHz
    count: 611

qa_signals: [convergence, ports_excited, in_band_resonance, energy_pass]
