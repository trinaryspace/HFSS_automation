  - op: unite
    name: TopCu
    with: [TopPad, TopBT00, TopBT01, TopBT02, TopBT03, TopBT04, TopBT05, TopBT06, TopBT07, TopBT08, TopBT09, TopBT10, TopBT11, TopBT12, TopBT13, TopBT14, TopBT15]

  # Far-side copper (KiCad B.Cu): mirror image, feed line runs to the tip.
