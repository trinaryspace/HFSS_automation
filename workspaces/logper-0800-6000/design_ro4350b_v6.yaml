# REDESIGN v6 = the v3 candidate re-scaled - design "LogPer_RO4350B_v6".
# Why: v3's two S11 spikes are the 2nd and 3rd harmonics of the largest
# element (about 0.79 GHz), at about 1.6 and 2.4 GHz - the upper one on the
# 2.4 GHz ISM band. They move with element size. The user's bands (2026-11-12):
# 800/900 MHz ISM, 1.8/1.9 GHz cell, 2.4 GHz ISM, 5.1-5.9 GHz Wi-Fi, other cell.
#   k_el 1.21  puts the harmonics near 1.50 and 2.25 GHz, in the gap between
#              the 2.1 GHz cell downlink (to 2.20) and 2.3 GHz
#   N 16       one more small element at the tip, so scaling the elements up
#              does not pull the upper band edge down into 5.8-5.9 GHz
# tau, spacing rule, feed strips, coax and tip pad are v3's.
#
# REDESIGN v3 = v2 + a matching pad at the tip - design "LogPer_RO4350B_v3".
# Why: v2 iteration 1, de-embedded to the tip, sits near 50 ohm in resistance
# but carries +9 to +25 ohm of reactance rising with frequency - about 1 nH in
# series, the centre conductor's loop from the coax end over the board tip.
# A shunt capacitance C = L / Z0^2 = 0.4 pF at the same place cancels it to
# first order. On 0.508 mm RO4350B that is 6.3 mm^2 of extra overlap between
# the two feed strips: both are widened from feed_W* to pad_W over the last
# pad_L before the coax end.  C_extra = eps0 * 3.66 * (pad_W - feed_W) * pad_L / h
#
# REDESIGN v2 for RO4350B 20 mil - design "LogPer_RO4350B_v2".
# Targets (user, 2026-11-10): 0.8-6 GHz, S11 below -10 dB, one forward lobe,
# board under 250 mm long (width free), to be fabricated on 20 mil RO4350B
# with 1 oz copper. The FR-4 original is the baseline; changes from it:
#   k_el      one scale factor on every element dimension and spacing, to put
#             the low band edge back at 0.8 GHz on the lighter-loading board.
#             Taken from the SIMULATED band-edge shift, not from the paper's
#             microstrip eps_eff formula (which predicts the wrong direction).
#   feed_Wt / feed_Wb   top (coax-side) and bottom feed-strip widths, separate
#             so unequal strips (the paper's balun) are a variable edit.
#   coax      Taoglas 1.37 mm micro-coax (CAB.01061), jacket stripped: braid
#             1.15 mm, FEP 0.92 mm, conductor 0.31 mm. It must be no wider than
#             feed_Wt, which RG316 (2.09 mm) was not on a 20 mil board.
#   bend_R    1.0 mm (was 1.5): the coax axis is lower on the thin board.
# Everything else - tau, element count, bow-tie shape - is the baseline's.
#
# logper-0800-6000 - printed log-periodic bow-tie dipole array, 0.8-6 GHz.
# Phase A: coax-fed, no enclosure. HFSS replica of the CST model
# "2_WITH_FEED_COAX_FR4_V1" in the ByTechLab repo
# (Repos/LogPer_Antenna/RF---PCB-Log-Periodic-Antenna--0.8-6-GHz-).
#
# GENERATED by tools/make_spec.py - the 30 bow-tie polylines follow one rule.
#
# Sources, cross-checked against each other in the Clarification block:
#   - CST parameter list (Touchstone header of
#     SIM_LOG_PERIODIC_COAX_FEED_WITHOUT_CASE.s1p)
#   - CST's own CAD export (CST_SIM/2_.../RESULTS/CAD/LOG_PERIOD.stp):
#     coax radii, coax axis height, wire bend, board outline
#   - KiCad copper polygons (LOG_PERIODIC_PCB.kicad_pcb, F.Cu / B.Cu)
#
# Frame: +x base -> tip, y transverse, z normal; substrate 0..h; coax on the
# z = h copper, far copper at z = 0.
#
# Element rule (n = 0..14): scale s_n = tau^n, centre xc_n = xc_(n-1) +
# bt_sp1*s_(n-1), root width bt_Wr1*s_n on the centreline, end width
# bt_We1*s_n at distance bt_L1*s_n. On the coax-side copper even n points +y;
# the far copper is the mirror image. Powers are written as chained products
# because the offline validator parses Python syntax and AEDT wants `^`.
#
# NOT expressible in schema v1, applied by post-compile staged scripts
# (recorded in state.md as Route-B add-ons):
#   src/20_feed_bend.py     - the centre conductor's 1.5 mm-radius bend
#   src/21_fr4_dispersion.py- FR-4 eps'(f), tand(f) from CST's fit tables
#   src/22_setup_extras.py  - broadband adaptive, field sweep, far-field sphere
spec_version: 1
name: logper-ro4350b-v6
recipe: printed-log-periodic-bowtie-array
solution_type: Modal            # explicit, never the default (env-compat #11)

provenance:
  source: "ByTechLab PCB Log Periodic Antenna (0.8-6 GHz), CST model 2_WITH_FEED_COAX_FR4_V1; design basis Abdulhameed & Kubik, Electronics 2022, 11, 2877"
  canonical_reading: measured
  notes: >-
    As-built dimensions of the CST model are canonical, not the paper's
    equations: CST parameter list, CST STEP export and KiCad copper agree
    (feed 4 x 203.5 mm, element 0 = 60 mm / 30 mm / 5 mm, tau 0.85, coax
    0.255/0.76/1.045 mm, axis 1.03 mm above the copper, bend radius 1.5 mm).
    Substrate 1.5 mm as simulated in CST (KiCad stackup says 1.51 mm).
    Copper is zero-thickness finite-conductivity sheets here (CST: 35 um
    solids).

variables:
  f_lo: 0.8GHz
  f_hi: 6GHz
  h: 0.508mm                      # RO4350B 20 mil
  pcb_Wtip: 20mm                  # pcb_width_top
  feed_Wt: 1.6mm                  # coax-side feed strip width
  feed_Wb: 1.6mm                  # far-side feed strip width
  k_el: 1.21                      # element scale vs the FR-4 baseline
  tau: 0.85                       # scaling ratio
  bt_L1: "60mm * k_el"
  bt_We1: "30mm * k_el"
  bt_Wr1: "5mm * k_el"
  bt_x1: "18mm * k_el"
  sp_fac: 1.0                     # spacing factor, keeps the taper angle
  bt_sp1: "30mm * k_el * sp_fac"
  r_in: 0.155mm                   # 0.31 mm conductor (Taoglas 1.37 mm cable)
  r_d: 0.46mm                     # 0.92 mm FEP insulation
  r_sh: 0.575mm                   # 1.15 mm braid, jacket stripped
  coax_zoff: "r_sh - 0.015mm"     # shield rests on the trace, sunk 0.015 mm
  bend_R: 1mm                     # centre-conductor bend radius
  feed_cut: "bend_R"              # coax-side strip stops one bend radius short
  wire_tail: 0.25mm               # cnd_off1: wire protrudes below the far copper
  cap_L: 1mm                      # PEC cap backing the internal wave port
  zc: "h + coax_zoff"
  pad_div: 6                      # 6 = tuning, 4 = final verification
  air_pad: "c0 / (pad_div * f_lo)"
  s0: 1
  s1: "s0 * tau"
  s2: "s1 * tau"
  s3: "s2 * tau"
  s4: "s3 * tau"
  s5: "s4 * tau"
  s6: "s5 * tau"
  s7: "s6 * tau"
  s8: "s7 * tau"
  s9: "s8 * tau"
  s10: "s9 * tau"
  s11: "s10 * tau"
  s12: "s11 * tau"
  s13: "s12 * tau"
  s14: "s13 * tau"
  s15: "s14 * tau"
  xc0: bt_x1
  xc1: "xc0 + bt_sp1 * s0"
  xc2: "xc1 + bt_sp1 * s1"
  xc3: "xc2 + bt_sp1 * s2"
  xc4: "xc3 + bt_sp1 * s3"
  xc5: "xc4 + bt_sp1 * s4"
  xc6: "xc5 + bt_sp1 * s5"
  xc7: "xc6 + bt_sp1 * s6"
  xc8: "xc7 + bt_sp1 * s7"
  xc9: "xc8 + bt_sp1 * s8"
  xc10: "xc9 + bt_sp1 * s9"
  xc11: "xc10 + bt_sp1 * s10"
  xc12: "xc11 + bt_sp1 * s11"
  xc13: "xc12 + bt_sp1 * s12"
  xc14: "xc13 + bt_sp1 * s13"
  xc15: "xc14 + bt_sp1 * s14"
  tip_len: 7.55mm                 # last element centre to the tip, as the baseline
  pcb_L: "xc15 + tip_len"
  pcb_Wbase: "2*bt_L1 + 40mm"     # baseline: 160 = 2*60 + 40
  coax_L: "pcb_L - feed_cut"
  pad_L: 3mm                      # tip matching pad, along the board
  pad_W: 3.7mm                    # tip matching pad, across the board

materials:
  # Rogers RO4350B, design Dk 3.66 and Df 0.0037 (10 GHz), treated as constant
  # over 0.4-6.5 GHz.
  ro4350b:
    permittivity: 3.66
    loss_tangent: 0.0037
  # Coax dielectric. Real FEP is 2.1; 1.70 is the value that makes these
  # datasheet radii a 50 ohm line with a solid centre conductor (the real one
  # is 7-strand, 50 +/- 3 ohm). Same device CST's model used for RG316.
  fep_coax:
    permittivity: 1.70
    loss_tangent: 0.0007
  # Coax conductors. Solid copper at these radii gives about 2.4 dB/m at
  # 6 GHz; the Taoglas datasheet says 3.7 dB/m (stranding, braid, foil). The
  # conductivity is reduced so the modelled cable loss matches the datasheet.
  cu_coax:
    permittivity: 1.0
    conductivity: 26000000
  cap_pec:
    library: pec
  air:
    library: air

geometry:
  # Trapezoidal board, as CST's PCB solid (no mounting holes in the CST model).
  - op: polyline
    name: Substrate
    material: ro4350b
    cover: true
    close: true
    points:
      - ["0mm", "-pcb_Wbase/2", "0mm"]
      - [pcb_L, "-pcb_Wtip/2", "0mm"]
      - [pcb_L, "pcb_Wtip/2", "0mm"]
      - ["0mm", "pcb_Wbase/2", "0mm"]
  - op: thicken_sheet
    name: Substrate
    thickness: h

  # Coax-side copper (KiCad F.Cu): feed line stops feed_cut short of the tip.
  # No material: sheets become metal by the boundaries below.
  - op: sheet
    name: TopCu
    plane: xy
    origin: ["0mm", "-feed_Wt/2", h]
    size: [coax_L, feed_Wt]
  - op: polyline
    name: TopBT00
    cover: true
    close: true
    points:
      - ["xc0 - bt_Wr1*s0/2", "0mm", h]
      - ["xc0 + bt_Wr1*s0/2", "0mm", h]
      - ["xc0 + bt_We1*s0/2", "bt_L1*s0", h]
      - ["xc0 - bt_We1*s0/2", "bt_L1*s0", h]
  - op: polyline
    name: TopBT01
    cover: true
    close: true
    points:
      - ["xc1 - bt_Wr1*s1/2", "0mm", h]
      - ["xc1 - bt_We1*s1/2", "-bt_L1*s1", h]
      - ["xc1 + bt_We1*s1/2", "-bt_L1*s1", h]
      - ["xc1 + bt_Wr1*s1/2", "0mm", h]
  - op: polyline
    name: TopBT02
    cover: true
    close: true
    points:
      - ["xc2 - bt_Wr1*s2/2", "0mm", h]
      - ["xc2 + bt_Wr1*s2/2", "0mm", h]
      - ["xc2 + bt_We1*s2/2", "bt_L1*s2", h]
      - ["xc2 - bt_We1*s2/2", "bt_L1*s2", h]
  - op: polyline
    name: TopBT03
    cover: true
    close: true
    points:
      - ["xc3 - bt_Wr1*s3/2", "0mm", h]
      - ["xc3 - bt_We1*s3/2", "-bt_L1*s3", h]
      - ["xc3 + bt_We1*s3/2", "-bt_L1*s3", h]
      - ["xc3 + bt_Wr1*s3/2", "0mm", h]
  - op: polyline
    name: TopBT04
    cover: true
    close: true
    points:
      - ["xc4 - bt_Wr1*s4/2", "0mm", h]
      - ["xc4 + bt_Wr1*s4/2", "0mm", h]
      - ["xc4 + bt_We1*s4/2", "bt_L1*s4", h]
      - ["xc4 - bt_We1*s4/2", "bt_L1*s4", h]
  - op: polyline
    name: TopBT05
    cover: true
    close: true
    points:
      - ["xc5 - bt_Wr1*s5/2", "0mm", h]
      - ["xc5 - bt_We1*s5/2", "-bt_L1*s5", h]
      - ["xc5 + bt_We1*s5/2", "-bt_L1*s5", h]
      - ["xc5 + bt_Wr1*s5/2", "0mm", h]
  - op: polyline
    name: TopBT06
    cover: true
