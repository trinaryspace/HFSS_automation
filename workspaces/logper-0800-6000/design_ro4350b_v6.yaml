      - ["xc8 + bt_We1*s8/2", "bt_L1*s8", h]
      - ["xc8 - bt_We1*s8/2", "bt_L1*s8", h]
  - op: polyline
    name: TopBT09
    cover: true
    close: true
    points:
      - ["xc9 - bt_Wr1*s9/2", "0mm", h]
      - ["xc9 - bt_We1*s9/2", "-bt_L1*s9", h]
      - ["xc9 + bt_We1*s9/2", "-bt_L1*s9", h]
      - ["xc9 + bt_Wr1*s9/2", "0mm", h]
  - op: polyline
    name: TopBT10
    cover: true
    close: true
    points:
      - ["xc10 - bt_Wr1*s10/2", "0mm", h]
      - ["xc10 + bt_Wr1*s10/2", "0mm", h]
      - ["xc10 + bt_We1*s10/2", "bt_L1*s10", h]
      - ["xc10 - bt_We1*s10/2", "bt_L1*s10", h]
  - op: polyline
    name: TopBT11
    cover: true
